services:
  db:
    image: postgres:15-alpine
    container_name: skill-mentor-db
    environment:
      POSTGRES_DB: skill_mentor_v2
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: skill-mentor-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
