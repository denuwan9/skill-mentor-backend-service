spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
logging.level.root=INFO

# Database Configuration (PostgreSQL - Local Docker)
spring.datasource.url=jdbc:postgresql://localhost:5433/skill_mentor_v2
spring.datasource.username=postgres
spring.datasource.password=password

# Redis Configuration (Local Docker)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

# Authentication Configuration (Clerk)
# Ensure this matches the 'clerk' type in ValidatorConfiguration
auth.validator.type=clerk
# Replace with your actual Clerk JWKS URL (e.g., https://api.clerk.com/v1/jwks/...)
clerk.jwks.url=https://busy-sunbeam-61.clerk.accounts.dev/.well-known/jwks.json

# Security User (for basic auth if enabled, or internal use)
spring.security.user.name=user
spring.security.user.password=password
